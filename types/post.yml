id: post
paths:
    - blog/posts

properties:
    title:
        type: string
        required: true
    publication:
        type: date
        required: true
    featured:
        type: bool
        required: false
        defaultValue: false
    cover:
        type: string
        required: false
    coverAlt:
        type: string
        required: false
    coverPhotographer:
        type: string
        required: false
    coverSource:
        type: string
        required: false

relations:
    authors:
        references: author
        type: many
        order:
            key: title
            direction: asc
    tags:
        references: tag
        type: many
        order:
            key: title
            direction: asc
