<!doctype html>
<html lang="en" data-sky-scene="golden">
<head>

  <style>
:root{--sky-start:#f0bf9b;--sky-end:#f8dba5;--theme-text:#302522;--theme-accent:#57301f}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{min-height:100vh;min-height:100svh;overflow:hidden;background:linear-gradient(180deg,var(--sky-start),var(--sky-end))}
.nature-scene{position:relative;inset:auto;width:100%;height:100vh;height:100svh;overflow:visible;opacity:1;pointer-events:none}
.nature-scene svg{display:block;width:100%;height:100%;overflow:visible}
/* Slow natural motifs shift with the selected time of day. */
.nature-scene{position:absolute;top:0;left:0;width:100%;height:100vh;z-index:0;overflow:visible;pointer-events:none;opacity:.38;transition:opacity 1.2s ease}
.nature-scene svg{display:block;width:100%;height:100%;overflow:visible}
.nature-scene g[class^="scene-"]{opacity:0;transition:opacity 1.8s ease}
html[data-sky-scene="night"] .scene-night,html[data-sky-scene="predawn"] .scene-predawn,html[data-sky-scene="dawn"] .scene-dawn,html[data-sky-scene="morning"] .scene-morning,html[data-sky-scene="noon"] .scene-noon,html[data-sky-scene="afternoon"] .scene-afternoon,html[data-sky-scene="dusk"] .scene-dusk{opacity:1}
.nature-scene circle,.nature-scene path,.nature-scene ellipse{vector-effect:non-scaling-stroke}
.night-stars,.predawn-stars{fill:#fff4ce}
.constellation circle{fill:#fff;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px #dceaff);animation:star-twinkle 2.4s ease-in-out infinite alternate}

.night-stars circle:nth-child(5n){animation-delay:-.7s;animation-duration:1.9s}

.night-stars>circle:nth-of-type(8n+6),.predawn-stars>circle:nth-of-type(8n+6){fill:#fff6e7}
.night-stars>circle:nth-of-type(8n+7),.predawn-stars>circle:nth-of-type(8n+7){fill:#ffc187}
.night-stars>circle:nth-of-type(8n+8),.predawn-stars>circle:nth-of-type(8n+8){fill:#e8efff}
.constellation-ursa circle:nth-child(1){fill:#bdd3ff}.constellation-ursa circle:nth-child(2){fill:#eef3ff}.constellation-ursa circle:nth-child(3){fill:#f9f4e6}.constellation-ursa circle:nth-child(4){fill:#e5edff}.constellation-ursa circle:nth-child(5){fill:#d9e5ff}.constellation-ursa circle:nth-child(6){fill:#f4f1e9}.constellation-ursa circle:nth-child(7){fill:#ffd08d}
.constellation-orion circle:nth-child(1){fill:#f08a76}.constellation-orion circle:nth-child(2){fill:#c7dcff}.constellation-orion circle:nth-child(3){fill:#ccddff}.constellation-orion circle:nth-child(4){fill:#edf3ff}.constellation-orion circle:nth-child(5){fill:#bed5ff}.constellation-orion circle:nth-child(6){fill:#d5e3ff}.constellation-orion circle:nth-child(7){fill:#9fbeff}
.shooting-star{fill:#fff;stroke:none;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px #b9d8ff);opacity:0;transform-box:fill-box;transform-origin:center;animation:shooting-star 20s linear infinite}
.shooting-star-tail-glow{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.24;filter:blur(2px)}

.shooting-star-two{animation-name:shooting-star-reverse;animation-delay:-9s;animation-duration:27s}

.mote-two{animation-delay:1.5s}.mote-three{animation-delay:.8s}.mote-four{animation-delay:2s}.mote-five{animation-delay:1.2s}

.firefly-three{animation:firefly-wander-three 9s ease-in-out infinite -4.5s}

.firefly-five{animation:firefly-wander-five 8.5s ease-in-out infinite -1.7s}
.firefly-six{animation:firefly-wander-six 9.5s ease-in-out infinite -3.8s}
.firefly-seven{animation:firefly-wander-seven 7.8s ease-in-out infinite -5.2s}
.firefly-eight{animation:firefly-wander-eight 10.5s ease-in-out infinite -7s}

.firefly-dash{fill:none;stroke:#f5e6a0;stroke-width:1.2;stroke-linecap:round;opacity:.7}

<body>
  <main class="nature-scene" aria-label="Golden Hour animation">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="shooting-star-gradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff8df" stop-opacity="0" /><stop offset="100%" stop-color="#fff" stop-opacity=".95" /></linearGradient><g id="dawn-bee"><g class="buzzing-fly"><path class="fly-vibration" d="M-22-5Q-16 0-22 5M-28-9Q-18 0-28 9M22-5Q16 0 22 5M28-9Q18 0 28 9" /><path class="bee-wings" d="M-2-2Q-9-12-13-6Q-13-2-3 1M0-2Q2-13 8-9Q10-5 3 0" /><ellipse class="bee-abdomen" cx="-4" cy="0" rx="5.2" ry="3.1" /><path class="bee-stripes" d="M-6-2.3v4.6M-2-3v6" /><ellipse class="bee-thorax" cx="2.5" cy="0" rx="3.2" ry="3.5" /><circle class="bee-head" cx="7" cy="0" r="2.7" /><path class="bee-antennae" d="M7-2q1-4 3-4m-1 4q3-3 5-2" /><path class="bee-legs" d="m-3 2-4 4m3-5-5 1m10 1 1 4m2-5 4 3" /></g></g><g id="singing-cicada"><path class="cicada-echo" d="M-7-4Q-15 0-7 4M7-4Q15 0 7 4M-8-9Q-21 0-8 9M8-9Q21 0 8 9" /><path class="cicada-wings" d="M-2-2Q-8-17-18-10Q-18-2-4 3M2-2Q8-17 18-10Q18-2 4 3" /><ellipse class="cicada-body" cy="0" rx="3.5" ry="8" /><circle class="cicada-body" cy="-8" r="3" /><path class="cicada-legs" d="M-2 4-8 9m10-5 6 5m-7-13-4-6m6 6 4-6" /></g></defs>
            
      <g class="scene-golden"></g>
    </svg>
    <canvas class="swallow-canvas" aria-label="A flock of swallows circling across the golden hour sky"></canvas>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector(".swallow-canvas");
      const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
      const width = 1440;
      const height = 900;
      const color = getComputedStyle(document.documentElement).getPropertyValue("--theme-muted").trim() || "#49362e";
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const random = (min, max) => min + Math.random() * (max - min);
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const angleDifference = (from, to) => Math.atan2(Math.sin(to - from), Math.cos(to - from));
      const wrap = (value, min, max) => value < min ? max - ((min - value) % (max - min)) : value > max ? min + ((value - max) % (max - min)) : value;
      const flock = Array.from({ length: 14 }, (_, index) => ({
        x: width * .5 + random(-145, 145),
        y: height * .38 + random(-105, 105),
        heading: random(0, Math.PI * 2),
        speed: random(82, 112),
        cruiseSpeed: random(105, 145),
        scale: random(.62, .96),
        phase: random(0, Math.PI * 2),
        dartIn: random(3, 8),
        dartFor: 0,
        dartHeading: 0,
        dartSpeed: 0,
        targetX: random(100, width - 100),
        targetY: random(100, height - 100),
        targetIn: random(3, 6),
      }));
      const leader = flock[0];
      let pointer = null;
      let previousTime = 0;
      let elapsed = 0;

      function pointerFlee(bird, radius) {
        if (!pointer) return null;
        const dx = bird.x - pointer.x;
        const dy = bird.y - pointer.y;
        const distance = Math.hypot(dx, dy);
        if (distance >= radius) return null;
        const angle = distance > .001 ? Math.atan2(dy, dx) : bird.phase;
        return { x: Math.cos(angle), y: Math.sin(angle), strength: 1 - distance / radius };
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
      }

      function moveLeader(dt) {
        leader.targetIn -= dt;
        if (leader.targetIn <= 0) {
          leader.targetX = random(70, width - 70);
          leader.targetY = random(65, height - 65);
          leader.targetIn = random(3.2, 6.2);
        }
        const flee = pointerFlee(leader, 230);
        const aim = flee
          ? Math.atan2(flee.y, flee.x)
          : Math.atan2(leader.targetY - leader.y, leader.targetX - leader.x);
        const weave = flee ? 0 : Math.sin(elapsed * 2.8 + leader.phase) * .16;
        const turnRate = flee ? 5 : 2.1;
        leader.heading += clamp(angleDifference(leader.heading, aim + weave), -turnRate * dt, turnRate * dt);
        leader.dartIn -= dt;
        let targetSpeed = leader.cruiseSpeed + (flee ? flee.strength * 155 : 0);
        if (flee) leader.dartFor = 0;
        if (!flee && leader.dartIn <= 0 && leader.dartFor <= 0) {
          leader.dartFor = random(.12, .2);
          leader.dartHeading = leader.heading + random(-.75, .75);
          leader.dartSpeed = random(175, 235);
          leader.dartIn = random(4, 8);
        }
        if (leader.dartFor > 0) {
          leader.dartFor -= dt;
          leader.heading += angleDifference(leader.heading, leader.dartHeading) * Math.min(1, dt * 7);
          targetSpeed = leader.dartSpeed;
        }
        leader.speed += (targetSpeed - leader.speed) * Math.min(1, dt * 2.8);
        leader.x += Math.cos(leader.heading) * leader.speed * dt;
        leader.y += Math.sin(leader.heading) * leader.speed * dt;
        leader.x = wrap(leader.x, -60, width + 60);
        leader.y = wrap(leader.y, -60, height + 60);
      }

      function moveFollowers(dt) {
        const snapshots = flock.map((bird) => ({ x: bird.x, y: bird.y, heading: bird.heading, speed: bird.speed }));
        for (let index = 1; index < flock.length; index += 1) {
          const bird = flock[index];
          const own = snapshots[index];
          let centerX = 0;
          let centerY = 0;
          let alignX = 0;
          let alignY = 0;
          let separationX = 0;
          let separationY = 0;
          let neighbors = 0;
          for (let otherIndex = 0; otherIndex < snapshots.length; otherIndex += 1) {
            if (otherIndex === index) continue;
            const other = snapshots[otherIndex];
            const dx = other.x - own.x;
            const dy = other.y - own.y;
            const distance = Math.hypot(dx, dy);
            if (distance < 220) {
              centerX += other.x;
              centerY += other.y;
              alignX += Math.cos(other.heading);
              alignY += Math.sin(other.heading);
              neighbors += 1;
            }
            if (distance > 0 && distance < 48) {
              const strength = (48 - distance) / 48;
              separationX -= dx / distance * strength;
              separationY -= dy / distance * strength;
            }
          }

          let steerX = Math.cos(leader.heading) * .55;
          let steerY = Math.sin(leader.heading) * .55;
          if (neighbors > 0) {
            centerX = centerX / neighbors - own.x;
            centerY = centerY / neighbors - own.y;
            const centerLength = Math.hypot(centerX, centerY) || 1;
            const alignLength = Math.hypot(alignX, alignY) || 1;
            steerX += centerX / centerLength * .9 + alignX / alignLength * .75;
            steerY += centerY / centerLength * .9 + alignY / alignLength * .75;
          }
          steerX += separationX * 1.6;
          steerY += separationY * 1.6;
          const flee = pointerFlee(bird, 205);
          if (flee) {
            steerX += flee.x * (2.2 + flee.strength * 2.2);
            steerY += flee.y * (2.2 + flee.strength * 2.2);
          }
          const desired = Math.atan2(steerY, steerX) + Math.sin(elapsed * 2.2 + bird.phase) * .12;
          const turnRate = flee ? 4.8 : 2.7;
          bird.heading += clamp(angleDifference(bird.heading, desired), -turnRate * dt, turnRate * dt);

          bird.dartIn -= dt;
          let targetSpeed = bird.cruiseSpeed + (flee ? flee.strength * 125 : 0);
          if (flee) bird.dartFor = 0;
          if (!flee && bird.dartIn <= 0 && bird.dartFor <= 0) {
            bird.dartFor = random(.1, .18);
            bird.dartHeading = bird.heading + random(-.8, .8);
            bird.dartSpeed = random(165, 225);
            bird.dartIn = random(4.5, 9);
          }
          if (bird.dartFor > 0) {
            bird.dartFor -= dt;
            bird.heading += angleDifference(bird.heading, bird.dartHeading) * Math.min(1, dt * 8);
            targetSpeed = bird.dartSpeed;
          }
          bird.speed += (targetSpeed - bird.speed) * Math.min(1, dt * 3.2);
          const flutter = Math.sin(elapsed * 3.5 + bird.phase) * 5;
          bird.x += (Math.cos(bird.heading) * bird.speed - Math.sin(bird.heading) * flutter + separationX * 65) * dt;
          bird.y += (Math.sin(bird.heading) * bird.speed + Math.cos(bird.heading) * flutter + separationY * 65) * dt;
          bird.x = wrap(bird.x, -60, width + 60);
          bird.y = wrap(bird.y, -60, height + 60);
        }
      }

      function drawSwallow(bird, time) {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.heading);
        ctx.scale(bird.scale, bird.scale);
        ctx.fillStyle = color;
        ctx.globalAlpha = 1;
        const wingBeat = Math.sin(time * 8 + bird.phase);
        ctx.beginPath();
        ctx.moveTo(-7, -1.6);
        ctx.bezierCurveTo(-13, -3.7, -20, -3.4, -25, -3.2);
        ctx.quadraticCurveTo(-19, -.9, -10, .5);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-7, 1.6);
        ctx.bezierCurveTo(-13, 3.7, -20, 3.4, -25, 3.2);
        ctx.quadraticCurveTo(-19, .9, -10, -.5);
        ctx.closePath();
        ctx.fill();

        for (const side of [-1, 1]) {
          ctx.save();
          ctx.translate(1, side * 1.2);
          ctx.rotate(side * (.08 + wingBeat * .16));
          ctx.beginPath();
          ctx.moveTo(1, side * 2.2);
          ctx.bezierCurveTo(-2, side * 7, -7, side * 16, -24, side * 20);
          ctx.bezierCurveTo(-13, side * 13, -9, side * 3, -4, side * 1);
          ctx.quadraticCurveTo(-1, side * .5, 1, side * 2.2);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.bezierCurveTo(5, -3.1, -1, -4.2, -8, -3.8);
        ctx.bezierCurveTo(-14, -3.4, -19, -1.5, -21, -.5);
        ctx.bezierCurveTo(-15, -.1, -10, .4, -7, .8);
        ctx.bezierCurveTo(-12, 1.5, -16, 2.5, -18, 3.3);
        ctx.bezierCurveTo(-10, 4.8, -1, 4, 6, 2.8);
        ctx.quadraticCurveTo(10, 1.5, 10, 0);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.arc(7.3, 0, 2.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(8.3, -.8);
        ctx.lineTo(11.2, 0);
        ctx.lineTo(8.3, .8);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function frame(timestamp = 0) {
        const dt = previousTime ? Math.min((timestamp - previousTime) / 1000, .04) : 0;
        previousTime = timestamp;
        elapsed += dt;
        ctx.clearRect(0, 0, width, height);
        if (!reducedMotion) {
          moveLeader(dt);
          moveFollowers(dt);
        }
        for (const bird of flock) drawSwallow(bird, elapsed);
        if (!reducedMotion) requestAnimationFrame(frame);
      }

      window.addEventListener("pointermove", (event) => {
        const rect = canvas.getBoundingClientRect();
        pointer = {
          x: (event.clientX - rect.left) / rect.width * width,
          y: (event.clientY - rect.top) / rect.height * height,
        };
      }, { passive: true });
      window.addEventListener("pointerleave", () => { pointer = null; }, { passive: true });
      window.addEventListener("resize", resize, { passive: true });
      resize();
      frame();
    })();
  </script>
</body>
</html>
