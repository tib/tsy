.nature-scene circle,.nature-scene path,.nature-scene ellipse{vector-effect:non-scaling-stroke}
.night-stars,.predawn-stars{fill:#fff4ce}

.night-stars circle,.predawn-stars circle{filter:none;animation:none;transform:scale(.74);transform-box:fill-box;transform-origin:center}

      function startMeteor() {
