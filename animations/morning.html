  <style>

body{min-height:100vh;min-height:100svh;overflow:hidden;background:linear-gradient(180deg,var(--sky-start),var(--sky-end))}

.dragonfly-canvas{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}

.nature-scene svg{display:block;width:100%;height:100%;overflow:visible}

.nature-scene circle,.nature-scene path,.nature-scene ellipse{vector-effect:non-scaling-stroke}
.night-stars,.predawn-stars{fill:#fff4ce}
.constellation circle{fill:#fff;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px #dceaff);animation:star-twinkle 2.4s ease-in-out infinite alternate}

.night-stars circle:nth-child(2n),.predawn-stars circle:nth-child(2n){animation-delay:1.3s}
.night-stars circle:nth-child(3n){animation-delay:2.1s}

.night-stars>circle:nth-of-type(8n+1),.predawn-stars>circle:nth-of-type(8n+1),.star-cluster circle:nth-child(5n+1){fill:#c6d9ff}

.night-stars>circle:nth-of-type(8n+6),.predawn-stars>circle:nth-of-type(8n+6){fill:#fff6e7}
.night-stars>circle:nth-of-type(8n+7),.predawn-stars>circle:nth-of-type(8n+7){fill:#ffc187}
.night-stars>circle:nth-of-type(8n+8),.predawn-stars>circle:nth-of-type(8n+8){fill:#e8efff}
.constellation-ursa circle:nth-child(1){fill:#bdd3ff}.constellation-ursa circle:nth-child(2){fill:#eef3ff}.constellation-ursa circle:nth-child(3){fill:#f9f4e6}.constellation-ursa circle:nth-child(4){fill:#e5edff}.constellation-ursa circle:nth-child(5){fill:#d9e5ff}.constellation-ursa circle:nth-child(6){fill:#f4f1e9}.constellation-ursa circle:nth-child(7){fill:#ffd08d}
.constellation-orion circle:nth-child(1){fill:#f08a76}.constellation-orion circle:nth-child(2){fill:#c7dcff}.constellation-orion circle:nth-child(3){fill:#ccddff}.constellation-orion circle:nth-child(4){fill:#edf3ff}.constellation-orion circle:nth-child(5){fill:#bed5ff}.constellation-orion circle:nth-child(6){fill:#d5e3ff}.constellation-orion circle:nth-child(7){fill:#9fbeff}

.shooting-star-tail-glow{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.24;filter:blur(2px)}

.firefly-one{animation:firefly-wander-one 8s ease-in-out infinite}
.firefly-two{animation:firefly-wander-two 10s ease-in-out infinite -2.4s}
.firefly-three{animation:firefly-wander-three 9s ease-in-out infinite -4.5s}
.firefly-four{animation:firefly-wander-four 11s ease-in-out infinite -6s}
.firefly-five{animation:firefly-wander-five 8.5s ease-in-out infinite -1.7s}
.firefly-six{animation:firefly-wander-six 9.5s ease-in-out infinite -3.8s}
.firefly-seven{animation:firefly-wander-seven 7.8s ease-in-out infinite -5.2s}
.firefly-eight{animation:firefly-wander-eight 10.5s ease-in-out infinite -7s}
.firefly-nine{animation:firefly-wander-three 8.7s ease-in-out infinite -2.8s}
.firefly-ten{animation:firefly-wander-two 9.2s ease-in-out infinite -6.4s}
.firefly-dash{fill:none;stroke:#f5e6a0;stroke-width:1.2;stroke-linecap:round;opacity:.7}
.firefly-dart{animation:firefly-dart 17s linear infinite -4.3s}
.dusk-reeds{fill:none;stroke:var(--theme-accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.58}

<body>
  <main class="nature-scene" aria-label="Summer Morning animation">

    <canvas class="dragonfly-canvas" aria-label="Small dragonflies darting through the morning sky"></canvas>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector(".dragonfly-canvas");
      const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
      const width = 1440;
      const height = 900;
      const color = getComputedStyle(document.documentElement).getPropertyValue("--theme-text").trim() || "#263a3d";
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const pointer = { x: 0, y: 0, active: false };
      let previousTime = 0;
      let elapsed = 0;
      const random = (min, max) => min + Math.random() * (max - min);
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const angleDifference = (from, to) => Math.atan2(Math.sin(to - from), Math.cos(to - from));
      const wrap = (value, min, max) => value < min ? max - ((min - value) % (max - min)) : value > max ? min + ((value - max) % (max - min)) : value;
      const colorChannels = (color) => color[0] === "#"
        ? [parseInt(color.slice(1, 3), 16), parseInt(color.slice(3, 5), 16), parseInt(color.slice(5, 7), 16), 1]
        : color.match(/[\d.]+/g).map(Number);
      const blendColor = (from, to, amount) => {
        const a = colorChannels(from);
        const b = colorChannels(to);
        return `rgba(${Math.round(a[0] + (b[0] - a[0]) * amount)},${Math.round(a[1] + (b[1] - a[1]) * amount)},${Math.round(a[2] + (b[2] - a[2]) * amount)},${a[3] + (b[3] - a[3]) * amount})`;
      };
      const wingPalettes = [
        { glow: "#b2d8bb", colors: ["rgba(171,211,158,.76)", "rgba(145,197,164,.64)", "rgba(205,227,179,.52)"], pale: ["rgba(238,245,226,.82)", "rgba(220,237,220,.7)", "rgba(231,242,222,.58)"] },
        { glow: "#cbd8a9", colors: ["rgba(198,211,153,.76)", "rgba(169,197,143,.64)", "rgba(222,228,183,.52)"], pale: ["rgba(246,243,224,.82)", "rgba(229,235,213,.7)", "rgba(240,239,221,.58)"] },
        { glow: "#c5b9da", colors: ["rgba(190,171,218,.76)", "rgba(168,164,211,.64)", "rgba(219,196,226,.52)"], pale: ["rgba(242,235,244,.82)", "rgba(226,222,239,.7)", "rgba(238,230,242,.58)"] },
        { glow: "#d5b5d2", colors: ["rgba(216,177,211,.76)", "rgba(190,166,207,.64)", "rgba(230,201,224,.52)"], pale: ["rgba(247,236,242,.82)", "rgba(232,222,239,.7)", "rgba(242,231,240,.58)"] },
        { glow: "#afcddd", colors: ["rgba(158,197,218,.76)", "rgba(147,178,215,.64)", "rgba(190,218,226,.52)"], pale: ["rgba(235,243,246,.82)", "rgba(216,230,243,.7)", "rgba(228,240,245,.58)"] },
        { glow: "#b5c2dc", colors: ["rgba(164,181,218,.76)", "rgba(148,177,218,.64)", "rgba(195,211,231,.52)"], pale: ["rgba(237,240,247,.82)", "rgba(218,230,244,.7)", "rgba(230,237,246,.58)"] },
      ];
      const dragonflies = Array.from({ length: 8 }, (_, index) => ({
        x: 105 + index % 4 * 390 + random(-55, 55),
        y: 130 + Math.floor(index / 4) * 520 + random(-90, 90),
        heading: random(0, Math.PI * 2),
        speed: random(75, 105),
        cruiseSpeed: random(105, 150),
        scale: random(.52, .72),
        phase: random(0, Math.PI * 2),
        targetX: random(80, width - 80),
        targetY: random(70, height - 70),
        targetIn: random(1, 3),
        dartIn: random(2, 5),
        dartFor: 0,
        dartHeading: 0,
        dartSpeed: 0,
        wingPaletteIndex: Math.floor(Math.random() * wingPalettes.length),
        wingPaletteTargetIndex: -1,
        wingPaletteProgress: 1,
        wingPaletteDuration: random(2.2, 3.5),
        wingPaletteIn: random(3, 6),
      }));

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
      }

      function pointerMove(event) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = (event.clientX - rect.left) / rect.width * width;
        pointer.y = (event.clientY - rect.top) / rect.height * height;
        pointer.active = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
      }

      function steer(dragonfly, dt) {
        if (dragonfly.wingPaletteTargetIndex < 0) dragonfly.wingPaletteTargetIndex = dragonfly.wingPaletteIndex;
        if (dragonfly.wingPaletteTargetIndex !== dragonfly.wingPaletteIndex) {
          dragonfly.wingPaletteProgress += dt / dragonfly.wingPaletteDuration;
          if (dragonfly.wingPaletteProgress >= 1) {
            dragonfly.wingPaletteIndex = dragonfly.wingPaletteTargetIndex;
            dragonfly.wingPaletteProgress = 1;
            dragonfly.wingPaletteIn = random(3, 6);
          }
        } else {
          dragonfly.wingPaletteIn -= dt;
          if (dragonfly.wingPaletteIn <= 0) {
            dragonfly.wingPaletteTargetIndex = (dragonfly.wingPaletteIndex + 1 + Math.floor(Math.random() * (wingPalettes.length - 1))) % wingPalettes.length;
            dragonfly.wingPaletteProgress = 0;
            dragonfly.wingPaletteDuration = random(2.2, 3.5);
          }
        }

        dragonfly.targetIn -= dt;
        if (dragonfly.targetIn <= 0) {
          dragonfly.targetX = random(50, width - 50);
          dragonfly.targetY = random(50, height - 50);
          dragonfly.targetIn = random(1.2, 3.4);
        }

        dragonfly.dartIn -= dt;
        if (dragonfly.dartIn <= 0 && dragonfly.dartFor <= 0) {
          dragonfly.dartFor = random(.12, .22);
          dragonfly.dartHeading = dragonfly.heading + random(-1.15, 1.15);
          dragonfly.dartSpeed = random(240, 330);
          dragonfly.dartIn = random(2.4, 5.2);
        }

        let flee = 0;
        let desired = Math.atan2(dragonfly.targetY - dragonfly.y, dragonfly.targetX - dragonfly.x);
        if (pointer.active) {
          const awayX = dragonfly.x - pointer.x;
          const awayY = dragonfly.y - pointer.y;
          const distance = Math.hypot(awayX, awayY);
          if (distance < 250) {
            flee = Math.pow(1 - distance / 250, 2);
            const away = distance > 1 ? Math.atan2(awayY, awayX) : dragonfly.heading + random(-Math.PI, Math.PI);
            desired += angleDifference(desired, away) * Math.min(1, flee * 1.8);
          }
        }

        const edge = Math.min(dragonfly.x, width - dragonfly.x, dragonfly.y, height - dragonfly.y);
        if (edge < 100) {
          const inward = Math.atan2(height / 2 - dragonfly.y, width / 2 - dragonfly.x);
          desired += angleDifference(desired, inward) * clamp((100 - edge) / 100, 0, 1) * 1.5;
        }

        let spacingX = 0;
        let spacingY = 0;
        for (const other of dragonflies) {
          if (other === dragonfly) continue;
          const dx = dragonfly.x - other.x;
          const dy = dragonfly.y - other.y;
          const distance = Math.hypot(dx, dy);
          if (distance > 0 && distance < 40) {
            const weight = (40 - distance) / 40;
            spacingX += dx / distance * weight;
            spacingY += dy / distance * weight;
          }
        }
        if (Math.hypot(spacingX, spacingY) > .01) {
          const away = Math.atan2(spacingY, spacingX);
          desired += angleDifference(desired, away) * Math.min(.8, Math.hypot(spacingX, spacingY));
        }

        const turnRate = 3.2 + flee * 6.5;
        dragonfly.heading += clamp(angleDifference(dragonfly.heading, desired), -turnRate * dt, turnRate * dt);
        let targetSpeed = dragonfly.cruiseSpeed * (1 + flee * 1.8);
        if (dragonfly.dartFor > 0) {
          dragonfly.dartFor -= dt;
          dragonfly.heading += angleDifference(dragonfly.heading, dragonfly.dartHeading) * Math.min(1, dt * 12);
          targetSpeed = dragonfly.dartSpeed;
        }
        dragonfly.speed += (targetSpeed - dragonfly.speed) * Math.min(1, dt * (3 + flee * 5));
        const flutter = Math.sin(elapsed * 6.3 + dragonfly.phase) * 13 + Math.sin(elapsed * 2.7 + dragonfly.phase) * 6;
        dragonfly.x += (Math.cos(dragonfly.heading) * dragonfly.speed - Math.sin(dragonfly.heading) * flutter) * dt;
        dragonfly.y += (Math.sin(dragonfly.heading) * dragonfly.speed + Math.cos(dragonfly.heading) * flutter) * dt;
        dragonfly.x = wrap(dragonfly.x, -70, width + 70);
        dragonfly.y = wrap(dragonfly.y, -70, height + 70);
      }

      function drawDragonfly(dragonfly, time) {
        ctx.save();
        ctx.translate(dragonfly.x, dragonfly.y);
        ctx.rotate(dragonfly.heading);
        ctx.scale(dragonfly.scale, dragonfly.scale);
        const flap = Math.sin(time * 86 + dragonfly.phase);
        const fromPalette = wingPalettes[dragonfly.wingPaletteIndex];
        const toPalette = wingPalettes[dragonfly.wingPaletteTargetIndex < 0 ? dragonfly.wingPaletteIndex : dragonfly.wingPaletteTargetIndex];
        const paletteBlend = dragonfly.wingPaletteTargetIndex === dragonfly.wingPaletteIndex ? 0 : clamp(dragonfly.wingPaletteProgress, 0, 1);
        const wingPalette = {
          glow: blendColor(fromPalette.glow, toPalette.glow, paletteBlend),
          color: blendColor(fromPalette.colors[1], toPalette.colors[1], paletteBlend),
          pale: blendColor(fromPalette.pale[1], toPalette.pale[1], paletteBlend),
        };
        for (const side of [-1, 1]) {
          for (const [rootX, length, width, sweep, whitePair] of [[4, 18, 1.9, .22, false], [-5.5, 16, 1.8, -.18, true]]) {
            ctx.save();
            ctx.translate(rootX, side * 1.8);
            const pairFlap = whitePair ? Math.sin(time * 86 + dragonfly.phase + .85) : flap;
            ctx.rotate(side * (sweep + pairFlap * .3));
            ctx.fillStyle = whitePair ? wingPalette.pale : wingPalette.color;
            ctx.globalAlpha = whitePair ? .72 : .68;
            ctx.shadowColor = wingPalette.glow;
            ctx.shadowBlur = whitePair ? .7 : 1.25 + Math.max(0, pairFlap) * .7;
            ctx.beginPath();
            ctx.ellipse(0, side * length * .48, width, length * .53, side * -.035, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = whitePair ? .42 : .34;
            ctx.strokeStyle = whitePair ? "rgba(255,255,255,.8)" : wingPalette.glow;
            ctx.lineWidth = .35;
            ctx.beginPath();
            ctx.moveTo(0, side * 1.5);
            ctx.lineTo(0, side * (length - .5));
            ctx.moveTo(-width * .7, side * (length * .38));
            ctx.lineTo(width * .7, side * (length * .46));
            ctx.moveTo(-width * .7, side * (length * .64));
            ctx.lineTo(width * .7, side * (length * .72));
            ctx.stroke();
            ctx.restore();
          }
        }

        ctx.globalAlpha = .64;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(-5, 0, 11, 1.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(2, 0, 3.2, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(8, 0, 2.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = .72;
        ctx.fillStyle = "rgba(255,255,255,.6)";
        ctx.beginPath();
        ctx.arc(8.8, -.75, .55, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function frame(timestamp = 0) {
        const dt = previousTime ? Math.min((timestamp - previousTime) / 1000, .04) : 0;
        previousTime = timestamp;
        elapsed += dt;
        ctx.clearRect(0, 0, width, height);
        if (!reducedMotion) for (const dragonfly of dragonflies) steer(dragonfly, dt);
        for (const dragonfly of dragonflies) drawDragonfly(dragonfly, elapsed);
        if (!reducedMotion) requestAnimationFrame(frame);
      }

      window.addEventListener("pointermove", pointerMove, { passive: true });
      window.addEventListener("pointerout", (event) => { if (!event.relatedTarget) pointer.active = false; }, { passive: true });
      window.addEventListener("resize", resize, { passive: true });
      resize();
      frame();
    })();
  </script>
</body>
</html>
